[package]
name = "cnc-studio-pro"
version = "0.1.0"
description = "GRBL CNC plotter workstation"
authors = ["CNC Studio Pro"]
edition = "2021"

[lib]
name = "cnc_studio_pro_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serialport = "4.6"
